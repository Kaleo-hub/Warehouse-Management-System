spring:
  application:
    name: wms-server

# 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/wms?useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

# flyway 配置
  flyway:
    locations: classpath:db/migration
    clean-disabled: true

# mybatis-plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted     # 实体里代表逻辑删除的字段名
      logic-delete-value: 1
      logic-not-delete-value: 0
