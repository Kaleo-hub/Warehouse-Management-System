spring:
  application:
    name: wms-server

# 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/wms?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

# flyway 配置
  flyway:
    locations: classpath:db/migration
    clean-disabled: true

# mybatis-plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted     # 实体里代表逻辑删除的字段名
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
wms:
  jwt:
    secret: ${JWT_SECRET:wms-local-dev-secret-key-change-me-before-production-2026}
    expire-minutes: 120

# 出库单超时自动释放（BR-010）
# 分配之后库存就被 locked_qty 占住了，这单一直没人处理的话那批货就被锁死 ——
# 这里配的就是「等多久算超时」和「多久扫一次」。
  outbound:
    # 分配后多少分钟还没往下走就自动释放
    allocated-timeout-minutes: 30
    # 扫描间隔与首次延迟（毫秒）。自测时可以把 scan-ms 调成 5000 快速看效果
    timeout-scan-ms: 60000
    timeout-initial-delay-ms: 20000
    # 单轮最多处理多少张单
    timeout-batch-size: 50
    # 总开关：本地调试或压测时可以关掉，避免后台悄悄改数据
    timeout-enabled: true

# 作业任务超时（docs/01 6.3 节状态机）
# 任务建出来就带 deadline，过期后自动标 TIMEOUT 并【只】重新入池一次。
  task:
    # 创建任务时给的时限：上架可以慢慢干，拣货在出库环节上要快
    putaway-deadline-minutes: 120
    pick-deadline-minutes: 30
    # 重新入池后给的新时限（和创建时限分开配，避免刚回池又超时）
    requeue-deadline-minutes: 60
    timeout-scan-ms: 60000
    timeout-initial-delay-ms: 30000
    timeout-enabled: true

# 幂等记录清理
# 幂等表是只增的，没有清理会无限长。默认 10 分钟扫一次、每次最多删 1 万行。
  idempotent:
    cleanup-ms: 600000
    cleanup-initial-delay-ms: 60000
    cleanup-enabled: true
    # 处理中租约（秒）。抢位时预约占用这么久；过期说明持锁进程已经不在了，允许别人接手。
    # 【千万别改小】30 秒对毫秒级的接口是三个数量级的余量；改小会真的重复执行。
    lease-seconds: 30
    # 兜底：处理中超过这么多分钟还没销登记，直接标成失败（让同 key 的请求可以重试）
    stale-processing-minutes: 60

# 日志配置
logging:
  level:
    # SQL 日志由 MyBatis 通过 slf4j 输出，级别是 DEBUG，打开 mapper 包才能看到
    com.myproject.wmsserver.system.mapper: DEBUG
  pattern:
    # %X{traceId} 取自 MDC，由 TraceIdFilter 在请求入口写入，用于串联同一次请求的所有日志
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{50} - %msg%n"
